<!DOCTYPE html>
<html>
<head>
    <title>Router Management</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>Router List</h1>
    <form method="POST" action="/add">
        <input name="ip" placeholder="Router IP" required />
        <input name="username" placeholder="Username" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Add Router</button>
    </form>
    <hr>
    <ul>
    {% for router in routers %}
        <li>
            <strong>IP:</strong> {{ router.ip }} | 
            <strong>User:</strong> {{ router.username }}
            <form method="POST" action="{{ url_for('delete_router', id=router._id) }}" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </li>
    {% endfor %}
    </ul>
</body>
</html>
